name: Build and publish NuGet package

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to NuGet
        default: "No"
        type: choice
        options:
          - "No"
          - Staging
          - Production
      zisk_ref:
        description: Zisk ref
        type: string
        default: v1.3.0-alpha
      build_docker:
        description: Build ZisK Docker image
        type: boolean
        default: false

env:
  ZISK_REF: ${{ inputs.zisk_ref }}

jobs:
  build-ziskos:
    name: Build ziskos
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build static library
        run: ./build/build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: libziskos
          path: |
            output/libziskos.a
            output/libziskos.bflat.manifest
          if-no-files-found: error

  build-nupkg:
    name: Build NuGet package
    needs: build-ziskos
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      NUGET_URL: ${{ inputs.publish == 'Staging' && 'https://int.nugettest.org' || 'https://www.nuget.org' }}
      NUGET_SOURCE: ${{ inputs.publish == 'Staging' && 'https://apiint.nugettest.org' || 'https://api.nuget.org' }}/v3/index.json
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6

      - name: Download libziskos artifact
        uses: actions/download-artifact@v8
        with:
          name: libziskos

      - name: Move artifacts to bindings
        run: |
          mkdir -p src/runtime/runtimes/linux-riscv64/native
          mv libziskos.a src/runtime/runtimes/linux-riscv64/native/
          mv libziskos.bflat.manifest src/runtime/

      - name: Detect version
        id: version
        run: |
          # Version tag (v0.17.0, v0.18.0-rc.1): tag without v + .<run>
          # Commit hash: 0.0.0-dev-<short hash>.<run>
          # Branch: 0.0.0-dev-<branch>.<run>
          if [[ "$ZISK_REF" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
            version="${BASH_REMATCH[1]}"
          elif [[ "$ZISK_REF" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
            version="0.0.0-dev-${ZISK_REF:0:7}"
          else
            version="0.0.0-dev-$(printf '%s' "$ZISK_REF" | tr -c '0-9A-Za-z-' '-')"
          fi
          version+=".${GITHUB_RUN_NUMBER}"
          echo "Detected version $version"
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Inject zisk_ref and package_version into manifest
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          MANIFEST=src/runtime/libziskos.bflat.manifest
          jq --arg ref "$ZISK_REF" --arg version "$VERSION" \
            '. + {zisk_ref: $ref, package_version: $version}' \
            "$MANIFEST" > "$MANIFEST.tmp"
          mv "$MANIFEST.tmp" "$MANIFEST"

      - name: Pack
        working-directory: src/runtime
        run: |
          dotnet pack Nethermind.ZiskOS.Runtime.csproj -c release \
            -p:Version=${{ steps.version.outputs.version }}

      - name: NuGet login
        uses: nuget/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
          audience: ${{ env.NUGET_URL }}
          token-service-url: ${{ env.NUGET_URL }}/api/v2/token

      - name: Publish NuGet package
        if: github.event_name == 'workflow_dispatch' && inputs.publish != 'No'
        working-directory: src/runtime
        run: |
          dotnet nuget push ./artifacts/package/release/*.nupkg \
            -k "${{ steps.login.outputs.NUGET_API_KEY }}" -s ${{ env.NUGET_SOURCE }}

      - name: Upload nupkg artifact
        uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: src/runtime/artifacts/package/release/*.nupkg
          if-no-files-found: error

  publish-docker:
    name: Publish ZisK Docker image
    if: inputs.build_docker
    needs: build-nupkg
    uses: ./.github/workflows/publish-docker.yml
    permissions:
      contents: read
      id-token: write
    with:
      zisk_ref: ${{ inputs.zisk_ref }}
    secrets: inherit

  publish-nupkg-github:
    name: Publish to GitHub
    if: github.event_name == 'workflow_dispatch' && inputs.publish != 'No'
    needs: build-nupkg
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download nupkg artifact
        uses: actions/download-artifact@v8
        with:
          name: nupkg
          path: nupkg

      - name: Download libziskos artifact
        uses: actions/download-artifact@v8
        with:
          name: libziskos
          path: libziskos

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build-nupkg.outputs.version }}
          name: Nethermind.ZiskOS.Runtime ${{ needs.build-nupkg.outputs.version }}
          files: |
            nupkg/*.nupkg
            nupkg/*.snupkg
            libziskos/libziskos.a
            libziskos/libziskos.bflat.manifest
          body: |
            NuGet package for ZisK C# bindings.

            **Package**: `Nethermind.ZiskOS.Runtime`
            **Version**: `${{ needs.build-nupkg.outputs.version }}`

            Built from zisk repository ref: `${{ env.ZISK_REF }}`
          draft: false
          prerelease: ${{ contains(needs.build-nupkg.outputs.version, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
